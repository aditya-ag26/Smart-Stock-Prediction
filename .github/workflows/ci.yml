name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/stockproject/predictor/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/stockproject/predictor/requirements.txt

      - name: Run stockapi test suite
        working-directory: backend/stockproject
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          SECURE_SSL_REDIRECT: "False"
        # NOTE: the `predictor` app has no automated tests yet - known gap,
        # tracked in the README rather than silently skipped.
        run: python manage.py test stockapi

  frontend-tests:
    name: Frontend tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run test suite
        working-directory: frontend
        run: npm test -- --ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-build-and-scan:
    name: Build & scan Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t time-series-system-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t time-series-system-frontend:ci ./frontend

      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: time-series-system-backend:ci
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

  deploy-backend:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: [docker-build-and-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        # Render's documented CI integration: a deploy hook URL that starts a
        # new deploy of the linked service/commit when requested.
        # https://render.com/docs/deploy-hooks
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"
